<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>FUTURUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="./vk-bridge-init.js?v=36"></script>
    <script>
      // Сейф на ТОЙ ЖЕ странице (?view=safe) — иначе VK на телефоне открывает браузер
      window.__FUTURUM_VIEW__ = new URLSearchParams(location.search).get("view") || "";
    </script>
  </head>
  <body>
    <script>
      (function boot() {
        var view = window.__FUTURUM_VIEW__;

        function keepHost(url) {
          try {
            var host = new URLSearchParams(location.search).get("host");
            if (host) url.searchParams.set("host", host);
          } catch (_) {}
          return url;
        }

        function openSafeView() {
          var u = new URL(location.href);
          u.searchParams.set("view", "safe");
          keepHost(u);
          // тот же path (index /ops-board/) — WebView не уходит в Safari/Chrome
          location.assign(u.pathname + u.search + u.hash);
        }

        window.futurumOpenSafe = openSafeView;

        if (view === "safe") {
          document.title = "FUTURUM · Хранилище";
          document.documentElement.style.height = "100%";
          document.body.style.cssText = "margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebe8";

          var css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = "./safe.css?v=42";
          document.head.appendChild(css);

          document.body.innerHTML =
            '<canvas id="c"></canvas>' +
            '<button type="button" id="room-back" class="room-back" hidden>← Назад</button>' +
            '<button type="button" id="step-back" class="step-back" hidden>Отойти</button>' +
            '<button type="button" id="nav-left" class="side-nav side-nav-left" hidden disabled title="Скоро">←</button>' +
            '<button type="button" id="nav-right" class="side-nav side-nav-right" hidden>→ Код</button>' +
            '<div id="peephole-mask" class="peephole-mask" hidden aria-hidden="true"></div>';

          var map = document.createElement("script");
          map.type = "importmap";
          map.textContent = JSON.stringify({
            imports: {
              three: "https://unpkg.com/three@0.160.0/build/three.module.js",
              "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            },
          });
          document.head.appendChild(map);

          var mod = document.createElement("script");
          mod.type = "module";
          mod.src = "./safe.js?v=95";
          document.body.appendChild(mod);
          return;
        }

        // —— лобби ——
        var lobbyCss = document.createElement("link");
        lobbyCss.rel = "stylesheet";
        lobbyCss.href = "./styles.css?v=36";
        document.head.appendChild(lobbyCss);

        document.body.innerHTML =
          '<div class="atmosphere" aria-hidden="true"></div>' +
          '<div class="scanlines" aria-hidden="true"></div>' +
          '<main class="dashboard dashboard-minimal">' +
          '  <section class="brand" aria-label="FUTURUM">' +
          '    <p class="brand-tag">community</p>' +
          '    <h1 class="glitch" data-text="FUTURUM">FUTURUM</h1>' +
          '    <p class="brand-line">welcome</p>' +
          '    <div class="user-chip" id="user-chip" hidden></div>' +
          '    <div class="game-links">' +
          '      <button type="button" class="game-link" id="btn-tower">Tower</button>' +
          '      <button type="button" class="game-link" id="btn-safe">Сейф</button>' +
          "    </div>" +
          "  </section>" +
          '  <section class="panel visits-panel" id="visits-panel" hidden aria-label="Заходы">' +
          '    <div class="panel-head"><h2>Кто заходил</h2></div>' +
          '    <p class="visits-hint">Пока журнал на этом устройстве. Общий лог — после хоста/бэкенда.</p>' +
          '    <ul class="visits-list" id="visits-list"></ul>' +
          "  </section>" +
          "</main>";

        document.getElementById("btn-safe").addEventListener("click", function (e) {
          e.preventDefault();
          openSafeView();
        });

        document.getElementById("btn-tower").addEventListener("click", function (e) {
          e.preventDefault();
          // башня пока отдельным файлом (если снова уведёт в браузер — сделаем так же)
          var u = new URL("./arena.html", location.href);
          location.assign(u.href);
        });

        var s1 = document.createElement("script");
        s1.src = "./vk-user.js?v=36";
        document.body.appendChild(s1);
        var s2 = document.createElement("script");
        s2.src = "./widget-admin.js?v=36";
        document.body.appendChild(s2);
      })();
    </script>
  </body>
</html>
