<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>FUTURUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=37" id="lobby-css" />
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="./vk-bridge-init.js?v=37"></script>
    <!-- importmap заранее: нужен до safe.js, без перезагрузки страницы -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="lobby-root">
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>

      <main class="dashboard dashboard-minimal">
        <section class="brand" aria-label="FUTURUM">
          <p class="brand-tag">community</p>
          <h1 class="glitch" data-text="FUTURUM">FUTURUM</h1>
          <p class="brand-line">welcome</p>
          <p class="brand-line" style="opacity:0.45;font-size:0.7rem;letter-spacing:0.08em">build 97 · сейф внутри</p>
          <div class="user-chip" id="user-chip" hidden></div>
          <div class="game-links">
            <button type="button" class="game-link" id="btn-tower">Tower</button>
            <button type="button" class="game-link" id="btn-safe">Сейф</button>
          </div>
        </section>

        <section class="panel visits-panel" id="visits-panel" hidden aria-label="Заходы">
          <div class="panel-head">
            <h2>Кто заходил</h2>
          </div>
          <p class="visits-hint">
            Пока журнал на этом устройстве. Общий лог — после хоста/бэкенда.
          </p>
          <ul class="visits-list" id="visits-list"></ul>
        </section>
      </main>
    </div>

    <div id="safe-root" hidden></div>

    <script src="./vk-user.js?v=37"></script>
    <script src="./widget-admin.js?v=37"></script>
    <script>
      (function () {
        var safeStarted = false;

        function wantSafeOnLoad() {
          try {
            return new URLSearchParams(location.search).get("view") === "safe";
          } catch (_) {
            return false;
          }
        }

        function markSafeUrl() {
          // только pushState — БЕЗ location.assign (иначе VK открывает браузер)
          try {
            var u = new URL(location.href);
            if (u.searchParams.get("view") === "safe") return;
            u.searchParams.set("view", "safe");
            history.pushState({ view: "safe" }, "", u.pathname + u.search + u.hash);
          } catch (_) {}
        }

        function startSafeInPlace() {
          if (safeStarted) return;
          safeStarted = true;

          var lobby = document.getElementById("lobby-root");
          var root = document.getElementById("safe-root");
          var lobbyCss = document.getElementById("lobby-css");

          if (lobby) lobby.hidden = true;
          if (lobbyCss) lobbyCss.disabled = true;

          document.title = "FUTURUM · Хранилище";
          document.documentElement.style.height = "100%";
          document.body.classList.add("checkin-lock");
          document.body.style.cssText =
            "margin:0;width:100%;height:100%;overflow:hidden;background:#0c1016";

          var css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = "./safe.css?v=47";
          document.head.appendChild(css);

          root.hidden = false;
          root.innerHTML =
            '<canvas id="c"></canvas>' +
            '<div id="checkin" class="checkin" role="dialog" aria-modal="true">' +
            '<div class="checkin-bg" aria-hidden="true"></div>' +
            '<div class="checkin-panel">' +
            '<div class="checkin-scan" aria-hidden="true"></div>' +
            '<p class="checkin-kicker">CHECKPOINT 01 · CLEARANCE</p>' +
            '<h1 class="checkin-brand">FUTURUM</h1>' +
            '<p class="checkin-sub">Перед входом укажите позывной.<br />Он будет на пропуске и на табло.</p>' +
            '<label class="checkin-label" for="checkin-name">Позывной</label>' +
            '<input id="checkin-name" class="checkin-input" type="text" maxlength="18" autocomplete="nickname" placeholder="например · NOVA" spellcheck="false" />' +
            '<div class="checkin-pass-wrap"><canvas id="checkin-pass" width="420" height="260"></canvas></div>' +
            '<button type="button" id="checkin-go" class="checkin-go" disabled>Выдать пропуск</button>' +
            '<p class="checkin-hint">После выдачи вы попадёте в холл</p>' +
            "</div></div>" +
            '<button type="button" id="room-back" class="room-back" hidden>← Назад</button>' +
            '<button type="button" id="step-back" class="step-back" hidden>Отойти</button>' +
            '<button type="button" id="nav-left" class="side-nav side-nav-left" hidden title="Архив">← Архив</button>' +
            '<button type="button" id="nav-right" class="side-nav side-nav-right" hidden>→ Код</button>' +
            '<div id="peephole-mask" class="peephole-mask" hidden></div>' +
            '<div id="peephole-status" class="peephole-status" hidden></div>' +
            '<div id="alarm-flash" class="alarm-flash" hidden></div>' +
            '<div id="note-overlay" class="note-overlay" hidden><div class="note-card"><div id="note-title" class="note-title"></div><div id="note-body" class="note-body"></div><button type="button" id="note-close" class="note-close">Закрыть</button></div></div>' +
            '<div id="finale-overlay" class="finale-overlay" hidden><div class="finale-card"><div class="finale-brand">FUTURUM</div><div id="finale-title" class="finale-title">Эвент пройден</div><div id="finale-body" class="finale-body"></div><button type="button" id="finale-close" class="note-close">Продолжить</button></div></div>';

          markSafeUrl();

          var mod = document.createElement("script");
          mod.type = "module";
          mod.src = "./safe.js?v=106";
          document.body.appendChild(mod);
        }

        window.futurumOpenSafe = startSafeInPlace;

        var btn = document.getElementById("btn-safe");
        if (btn) {
          btn.addEventListener(
            "click",
            function (e) {
              e.preventDefault();
              e.stopPropagation();
              startSafeInPlace();
            },
            true
          );
        }

        var tower = document.getElementById("btn-tower");
        if (tower) {
          tower.addEventListener("click", function (e) {
            e.preventDefault();
            alert("Tower пока отдельно. Сейф открывается внутри мини-аппа.");
          });
        }

        if (wantSafeOnLoad()) startSafeInPlace();
      })();
    </script>
  </body>
</html>
