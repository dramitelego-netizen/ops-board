<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>FUTURUM · Хранилище</title>
    <script>
      // Не уходим на другой документ через assign — только replace на корень с hash,
      // а лучше сразу сказать открыть мини-апп с главной.
      // Для VK: пользователь должен жать «Сейф» на главной (без смены URL-файла).
      (function () {
        try {
          var host = new URLSearchParams(location.search).get("host") || "";
          var q = "view=safe" + (host ? "&host=" + encodeURIComponent(host) : "");
          // replace на index того же каталога (один раз при прямом заходе с ПК)
          location.replace("./?" + q);
        } catch (_) {
          location.replace("./?view=safe");
        }
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; padding: 24px">Открытие…</p>
  </body>
</html>
