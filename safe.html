<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>FUTURUM · Хранилище</title>
    <link rel="stylesheet" href="./safe.css?v=50" />
  </head>
  <body class="checkin-lock">
    <canvas id="c"></canvas>
    <div id="checkin" class="checkin" role="dialog" aria-modal="true" aria-labelledby="checkin-brand">
      <div class="checkin-bg" aria-hidden="true">
        <div class="checkin-grid"></div>
        <div class="checkin-orb checkin-orb-a"></div>
        <div class="checkin-orb checkin-orb-b"></div>
      </div>
      <div class="checkin-panel">
        <div class="checkin-scan" aria-hidden="true"></div>
        <div class="checkin-chrome">
          <span class="checkin-led"></span>
          <span id="checkin-boot" class="checkin-boot">SYS · BOOTING CLEARANCE NODE…</span>
        </div>
        <p class="checkin-kicker">
          <span class="glitch-mini" data-text="CHECKPOINT 01">CHECKPOINT 01</span>
          · IDENTITY FORGE
        </p>
        <h1 id="checkin-brand" class="checkin-brand glitch" data-text="FUTURUM">FUTURUM</h1>
        <p class="checkin-sub">
          Создайте позывной агента.<br />
          Эмблема и пропуск соберутся сами.
        </p>
        <div class="checkin-id-row">
          <canvas id="checkin-avatar" class="checkin-avatar" width="112" height="112" aria-hidden="true"></canvas>
          <div class="checkin-id-fields">
            <label class="checkin-label" for="checkin-name">Позывной</label>
            <input
              id="checkin-name"
              class="checkin-input"
              type="text"
              maxlength="18"
              autocomplete="nickname"
              placeholder="введите · CALLSIGN"
              spellcheck="false"
            />
            <p id="checkin-class" class="checkin-class">CLASS · —</p>
          </div>
        </div>
        <div class="checkin-pass-wrap">
          <div class="checkin-pass-shine" aria-hidden="true"></div>
          <canvas id="checkin-pass" width="420" height="260" aria-hidden="true"></canvas>
        </div>
        <button type="button" id="checkin-go" class="checkin-go" disabled>
          <span class="checkin-go-glow" aria-hidden="true"></span>
          Выковать пропуск
        </button>
        <p class="checkin-hint">печать · ключ · коридор комнат</p>
      </div>
    </div>
    <div id="intro-letter" class="intro-letter" hidden data-step="0">
      <div class="intro-letter-dim"></div>
      <div class="phys-stage">
        <div class="phys-env" id="phys-env" aria-hidden="true">
          <div class="phys-env-back"></div>
          <div class="phys-key-piece" id="phys-key-piece">
            <span class="phys-key-tag" id="phys-key-tag">07</span>
          </div>
          <div class="phys-letter" id="phys-letter">
            <p class="phys-letter-seal">FUTURUM · PRIVATE</p>
            <h2 class="phys-letter-title">Приглашение</h2>
            <p class="phys-letter-body" id="intro-sheet-body"></p>
          </div>
          <div class="phys-env-pocket"></div>
          <div class="phys-env-flap" id="phys-flap"></div>
        </div>
        <p class="phys-hint" id="phys-hint">Конверт у вас в руках</p>
        <button type="button" id="phys-action" class="phys-action">Открыть конверт</button>
      </div>
    </div>
    <div id="intro-key-hud" class="intro-key-hud" hidden>
      <div class="intro-key-visual" aria-hidden="true"></div>
      <div class="intro-key-meta">
        <span class="intro-key-label">Ключ в руке</span>
        <span class="intro-key-room">КОМН. <b id="intro-key-no">—</b></span>
      </div>
    </div>
    <button type="button" id="room-back" class="room-back" hidden>← Назад</button>
    <button type="button" id="step-back" class="step-back" hidden>Отойти</button>
    <button type="button" id="nav-left" class="side-nav side-nav-left" hidden title="Архив">← Архив</button>
    <button type="button" id="nav-right" class="side-nav side-nav-right" hidden>→ Код</button>
    <div id="peephole-mask" class="peephole-mask" hidden aria-hidden="true"></div>
    <div id="peephole-status" class="peephole-status" hidden aria-hidden="true"></div>
    <div id="alarm-flash" class="alarm-flash" hidden aria-hidden="true"></div>
    <div id="note-overlay" class="note-overlay" hidden>
      <div class="note-card">
        <div id="note-title" class="note-title"></div>
        <div id="note-body" class="note-body"></div>
        <button type="button" id="note-close" class="note-close">Закрыть</button>
      </div>
    </div>
    <div id="finale-overlay" class="finale-overlay" hidden>
      <div class="finale-card">
        <div class="finale-brand">FUTURUM</div>
        <div id="finale-title" class="finale-title">Эвент пройден</div>
        <div id="finale-body" class="finale-body"></div>
        <button type="button" id="finale-close" class="note-close">Продолжить</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./safe.js?v=109"></script>
  </body>
</html>
