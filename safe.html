<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>FUTURUM · Хранилище</title>
    <script>
      // VK на телефоне открывает другой .html в браузере.
      // Сейф живёт на той же странице мини-аппа: index / ?view=safe
      (function () {
        try {
          var u = new URL(location.href);
          var target = new URL("./", u.href);
          target.searchParams.set("view", "safe");
          var host = u.searchParams.get("host");
          if (host) target.searchParams.set("host", host);
          location.replace(target.pathname + target.search + target.hash);
        } catch (_) {
          location.replace("./?view=safe");
        }
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; padding: 24px; color: #444">Открытие сейфа…</p>
  </body>
</html>
