<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>FUTURUM · Хранилище</title>
    <link rel="stylesheet" href="./safe.css?v=48" />
  </head>
  <body class="checkin-lock">
    <canvas id="c"></canvas>
    <div id="checkin" class="checkin" role="dialog" aria-modal="true" aria-labelledby="checkin-brand">
      <div class="checkin-bg" aria-hidden="true"></div>
      <div class="checkin-panel">
        <div class="checkin-scan" aria-hidden="true"></div>
        <p class="checkin-kicker">CHECKPOINT 01 · CLEARANCE</p>
        <h1 id="checkin-brand" class="checkin-brand">FUTURUM</h1>
        <p class="checkin-sub">Перед входом в хранилище укажите позывной.<br />Он будет на пропуске и на табло эвента.</p>
        <label class="checkin-label" for="checkin-name">Позывной</label>
        <input
          id="checkin-name"
          class="checkin-input"
          type="text"
          maxlength="18"
          autocomplete="nickname"
          placeholder="например · NOVA"
          spellcheck="false"
        />
        <div class="checkin-pass-wrap">
          <canvas id="checkin-pass" width="420" height="260" aria-hidden="true"></canvas>
        </div>
        <button type="button" id="checkin-go" class="checkin-go" disabled>Выдать пропуск</button>
        <p class="checkin-hint">После выдачи — коридор комнат</p>
      </div>
    </div>
    <div id="intro-letter" class="intro-letter" hidden>
      <div class="intro-letter-dim"></div>
      <div class="intro-envelope" id="intro-envelope">
        <div class="intro-flap"></div>
        <div class="intro-sheet" id="intro-sheet">
          <p class="intro-sheet-seal">FUTURUM · PRIVATE</p>
          <h2 class="intro-sheet-title">Приглашение</h2>
          <p class="intro-sheet-body" id="intro-sheet-body"></p>
          <button type="button" id="intro-letter-close" class="intro-letter-close">Сложить письмо</button>
        </div>
      </div>
    </div>
    <div id="intro-key-hud" class="intro-key-hud" hidden>
      <div class="intro-key-visual" aria-hidden="true"></div>
      <div class="intro-key-meta">
        <span class="intro-key-label">Ваш ключ</span>
        <span class="intro-key-room">КОМН. <b id="intro-key-no">—</b></span>
      </div>
    </div>
    <button type="button" id="room-back" class="room-back" hidden>← Назад</button>
    <button type="button" id="step-back" class="step-back" hidden>Отойти</button>
    <button type="button" id="nav-left" class="side-nav side-nav-left" hidden title="Архив">← Архив</button>
    <button type="button" id="nav-right" class="side-nav side-nav-right" hidden>→ Код</button>
    <div id="peephole-mask" class="peephole-mask" hidden aria-hidden="true"></div>
    <div id="peephole-status" class="peephole-status" hidden aria-hidden="true"></div>
    <div id="alarm-flash" class="alarm-flash" hidden aria-hidden="true"></div>
    <div id="note-overlay" class="note-overlay" hidden>
      <div class="note-card">
        <div id="note-title" class="note-title"></div>
        <div id="note-body" class="note-body"></div>
        <button type="button" id="note-close" class="note-close">Закрыть</button>
      </div>
    </div>
    <div id="finale-overlay" class="finale-overlay" hidden>
      <div class="finale-card">
        <div class="finale-brand">FUTURUM</div>
        <div id="finale-title" class="finale-title">Эвент пройден</div>
        <div id="finale-body" class="finale-body"></div>
        <button type="button" id="finale-close" class="note-close">Продолжить</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./safe.js?v=107"></script>
  </body>
</html>
